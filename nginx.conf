server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  error_page 404 /404.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  gzip on;
  gzip_vary on;
  gzip_min_length 256;
  gzip_types text/css application/javascript application/json image/svg+xml;


  # HTML sempre revalida (ETag -> 304 barato) para um deploy novo aparecer na hora
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri $uri/ =404;
  }

  # CSS/JS levam ?v=<hash> (version-assets.sh), fontes e imagens quase nunca mudam
  location /assets/ {
    add_header Cache-Control "public, max-age=2592000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Posts do LinkedIn mudam pouco: 5 min de cache em vez de buscar a cada visita
  location = /assets/data/linkedin-posts.json {
    add_header Cache-Control "public, max-age=300";
    add_header X-Content-Type-Options "nosniff" always;
  }

  location = /.well-known/security.txt {
    default_type text/plain;
    add_header Access-Control-Allow-Origin "*";
  }
}
